<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaPal - 프로필 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .section {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            margin-right: 0.5rem;
            width: 18px;
            height: 18px;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 1rem;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .profile-display {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 1rem;
        }

        .profile-display h3 {
            color: #667eea;
            margin-bottom: 1rem;
        }

        .profile-item {
            margin-bottom: 0.75rem;
        }

        .profile-item strong {
            display: inline-block;
            width: 150px;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .auth-warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .auth-warning a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-warning a:hover {
            text-decoration: underline;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="card">
            <h1>🌐 LinguaPal</h1>
            <p class="subtitle">프로필 생성 및 수정 테스트</p>

            <div id="auth-warning" class="auth-warning hidden">
                ⚠️ 로그인이 필요합니다. <a href="test_login.html">로그인 페이지</a>로 이동하여 먼저 로그인하세요.
            </div>

            <div id="user-info" class="hidden">
                <div class="profile-item">
                    <strong>로그인된 사용자:</strong> <span id="current-user-email">-</span>
                </div>
                <div class="profile-item">
                    <strong>역할:</strong> <span id="current-user-role">-</span>
                </div>
                <div class="profile-item">
                    <strong>프로필 상태:</strong> <span id="profile-status">확인 중...</span>
                </div>
            </div>
        </div>

        <!-- 프로필 조회 -->
        <div class="card" id="profile-view-section">
            <h2>📋 내 프로필 조회</h2>

            <button onclick="loadProfile()">프로필 조회</button>

            <div id="profile-result" class="result"></div>
            <div id="profile-display" class="hidden"></div>
        </div>

        <!-- 프로필 생성 -->
        <div class="card" id="profile-create-section" class="hidden">
            <h2>✨ 프로필 생성</h2>

            <form id="create-profile-form" onsubmit="createProfile(event)">
                <div class="form-group">
                    <label for="create-nickname">닉네임 *</label>
                    <input type="text" id="create-nickname" required minlength="2" maxlength="50"
                           placeholder="2~50자 사이의 닉네임을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="create-country">출신 국가 *</label>
                    <select id="create-country" required>
                        <option value="">국가를 선택하세요</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>배우고자 하는 언어 * (최소 1개 이상)</label>
                    <div id="create-languages" class="checkbox-group">
                        <!-- 동적으로 생성됨 -->
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit">프로필 생성</button>
                    <button type="button" class="secondary" onclick="loadMasterData()">언어/국가 다시 로드</button>
                </div>
            </form>

            <div id="create-result" class="result"></div>
        </div>

        <!-- 프로필 수정 -->
        <div class="card hidden" id="profile-update-section">
            <h2>✏️ 프로필 수정</h2>

            <p class="subtitle">닉네임과 배우고자 하는 언어만 수정할 수 있습니다. (출신 국가는 수정 불가)</p>

            <form id="update-profile-form" onsubmit="updateProfile(event)">
                <div class="form-group">
                    <label for="update-nickname">닉네임</label>
                    <input type="text" id="update-nickname" minlength="2" maxlength="50"
                           placeholder="새로운 닉네임을 입력하세요">
                </div>

                <div class="form-group">
                    <label>배우고자 하는 언어</label>
                    <div id="update-languages" class="checkbox-group">
                        <!-- 동적으로 생성됨 -->
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit">프로필 수정</button>
                    <button type="button" class="secondary" onclick="loadProfile()">취소</button>
                </div>
            </form>

            <div id="update-result" class="result"></div>
        </div>

        <!-- 현재 사용자 정보 (프로필 포함) -->
        <div class="card">
            <h2>👤 현재 사용자 정보 (프로필 포함)</h2>

            <button onclick="loadCurrentUser()">현재 사용자 정보 조회</button>

            <div id="current-user-result" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        let masterData = {
            languages: [],
            countries: []
        };

        // 로컬 스토리지에서 액세스 토큰 가져오기
        function getAccessToken() {
            return localStorage.getItem('access_token');
        }

        // 인증 헤더 생성
        function getAuthHeaders() {
            const token = getAccessToken();
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        // 결과 표시 함수
        function showResult(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.innerHTML = message;
        }

        // 로그인 확인
        async function checkAuth() {
            const token = getAccessToken();

            if (!token) {
                document.getElementById('auth-warning').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                return false;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/users/me`, {
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        const data = result.data;
                        document.getElementById('auth-warning').classList.add('hidden');
                        document.getElementById('user-info').classList.remove('hidden');
                        document.getElementById('current-user-email').textContent = data.email;

                        // 역할별 배지 색상
                        const roleBadgeColors = {
                            'admin': '#dc3545',
                            'staff': '#fd7e14',
                            'user': '#28a745'
                        };
                        const roleColor = roleBadgeColors[data.role] || '#6c757d';
                        document.getElementById('current-user-role').innerHTML =
                            `<span style="background: ${roleColor}; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem;">${data.role_display || data.role}</span>`;

                        if (data.has_profile) {
                            document.getElementById('profile-status').innerHTML =
                                '<span style="color: #28a745;">✅ 프로필 있음</span>';
                            document.getElementById('profile-create-section').classList.add('hidden');
                            document.getElementById('profile-update-section').classList.remove('hidden');
                        } else {
                            document.getElementById('profile-status').innerHTML =
                                '<span style="color: #dc3545;">❌ 프로필 없음</span>';
                            document.getElementById('profile-create-section').classList.remove('hidden');
                            document.getElementById('profile-update-section').classList.add('hidden');
                        }

                        return true;
                    }
                } else {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    document.getElementById('auth-warning').classList.remove('hidden');
                    document.getElementById('user-info').classList.add('hidden');
                    return false;
                }
            } catch (error) {
                console.error('Auth check error:', error);
                return false;
            }
        }

        // 마스터 데이터 로드 (언어, 국가)
        async function loadMasterData() {
            try {
                // 언어 목록 로드
                const langResponse = await fetch(`${API_BASE_URL}/master/languages`);
                const langResult = await langResponse.json();
                const languages = langResult.data.languages;
                masterData.languages = languages;

                // 국가 목록 로드
                const countryResponse = await fetch(`${API_BASE_URL}/master/countries`);
                const countryResult = await countryResponse.json();
                const countries = countryResult.data.countries;
                masterData.countries = countries;

                // 국가 선택 박스 업데이트
                const countrySelect = document.getElementById('create-country');
                countrySelect.innerHTML = '<option value="">국가를 선택하세요</option>';
                countries.forEach(country => {
                    countrySelect.innerHTML += `
                        <option value="${country.id}">${country.name_ko} (${country.name_en})</option>
                    `;
                });

                // 언어 체크박스 업데이트 (생성 폼)
                const createLangContainer = document.getElementById('create-languages');
                createLangContainer.innerHTML = '';
                languages.forEach(lang => {
                    createLangContainer.innerHTML += `
                        <div class="checkbox-item">
                            <input type="checkbox" id="create-lang-${lang.id}" value="${lang.id}">
                            <label for="create-lang-${lang.id}">${lang.name_ko} (${lang.code})</label>
                        </div>
                    `;
                });

                // 언어 체크박스 업데이트 (수정 폼)
                const updateLangContainer = document.getElementById('update-languages');
                updateLangContainer.innerHTML = '';
                languages.forEach(lang => {
                    updateLangContainer.innerHTML += `
                        <div class="checkbox-item">
                            <input type="checkbox" id="update-lang-${lang.id}" value="${lang.id}">
                            <label for="update-lang-${lang.id}">${lang.name_ko} (${lang.code})</label>
                        </div>
                    `;
                });

                showResult('create-result', 'success', '✅ 언어 및 국가 목록을 성공적으로 로드했습니다.');
                setTimeout(() => {
                    document.getElementById('create-result').style.display = 'none';
                }, 3000);

            } catch (error) {
                console.error('Error loading master data:', error);
                showResult('create-result', 'error', `❌ 마스터 데이터 로드 실패: ${error.message}`);
            }
        }

        // 프로필 조회
        async function loadProfile() {
            showResult('profile-result', 'info', '<div class="loading"></div> 프로필 조회 중...');

            try {
                const response = await fetch(`${API_BASE_URL}/users/me/profile`, {
                    headers: getAuthHeaders()
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const data = result.data;

                    // 프로필 표시
                    const languageBadges = data.learning_languages
                        .map(lang => `<span class="badge">${lang.name_ko} (${lang.code})</span>`)
                        .join('');

                    document.getElementById('profile-display').innerHTML = `
                        <h3>프로필 정보</h3>
                        <div class="profile-item">
                            <strong>닉네임:</strong> ${data.nickname}
                        </div>
                        <div class="profile-item">
                            <strong>이메일:</strong> ${data.user_email}
                        </div>
                        <div class="profile-item">
                            <strong>출신 국가:</strong> ${data.country.name_ko} (${data.country.name_en})
                        </div>
                        <div class="profile-item">
                            <strong>배우고자 하는 언어:</strong><br>
                            ${languageBadges}
                        </div>
                        <div class="profile-item">
                            <strong>생성일:</strong> ${new Date(data.created_at).toLocaleString('ko-KR')}
                        </div>
                        <div class="profile-item">
                            <strong>수정일:</strong> ${new Date(data.updated_at).toLocaleString('ko-KR')}
                        </div>
                    `;
                    document.getElementById('profile-display').classList.remove('hidden');

                    showResult('profile-result', 'success', '✅ 프로필을 성공적으로 조회했습니다.');

                    // 수정 폼에 현재 값 설정
                    document.getElementById('update-nickname').value = data.nickname;
                    data.learning_languages.forEach(lang => {
                        const checkbox = document.getElementById(`update-lang-${lang.id}`);
                        if (checkbox) checkbox.checked = true;
                    });

                } else if (response.status === 404) {
                    document.getElementById('profile-display').classList.add('hidden');
                    showResult('profile-result', 'info', 'ℹ️ 프로필이 존재하지 않습니다. 프로필을 생성해주세요.');
                } else {
                    showResult('profile-result', 'error', `❌ 프로필 조회 실패: ${result.message || JSON.stringify(result)}`);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                showResult('profile-result', 'error', `❌ 네트워크 오류: ${error.message}`);
            }
        }

        // 프로필 생성
        async function createProfile(event) {
            event.preventDefault();

            const nickname = document.getElementById('create-nickname').value;
            const country = document.getElementById('create-country').value;

            // 선택된 언어 ID 수집
            const selectedLanguages = [];
            document.querySelectorAll('#create-languages input[type="checkbox"]:checked').forEach(checkbox => {
                selectedLanguages.push(parseInt(checkbox.value));
            });

            if (!country) {
                showResult('create-result', 'error', '❌ 국가를 선택해주세요.');
                return;
            }

            if (selectedLanguages.length === 0) {
                showResult('create-result', 'error', '❌ 최소 1개 이상의 언어를 선택해주세요.');
                return;
            }

            showResult('create-result', 'info', '<div class="loading"></div> 프로필 생성 중...');

            try {
                const response = await fetch(`${API_BASE_URL}/users/me/profile/create`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        nickname: nickname,
                        country: parseInt(country),
                        learning_language_ids: selectedLanguages
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showResult('create-result', 'success', '✅ 프로필이 성공적으로 생성되었습니다!');

                    // 폼 초기화
                    document.getElementById('create-profile-form').reset();

                    // 프로필 조회
                    await loadProfile();
                    await checkAuth();
                } else {
                    const errorMsg = result.data?.errors
                        ? JSON.stringify(result.data.errors, null, 2)
                        : result.message || JSON.stringify(result, null, 2);
                    showResult('create-result', 'error', `❌ 프로필 생성 실패: ${errorMsg}`);
                }
            } catch (error) {
                console.error('Error creating profile:', error);
                showResult('create-result', 'error', `❌ 네트워크 오류: ${error.message}`);
            }
        }

        // 프로필 수정
        async function updateProfile(event) {
            event.preventDefault();

            const nickname = document.getElementById('update-nickname').value;

            // 선택된 언어 ID 수집
            const selectedLanguages = [];
            document.querySelectorAll('#update-languages input[type="checkbox"]:checked').forEach(checkbox => {
                selectedLanguages.push(parseInt(checkbox.value));
            });

            const updateData = {};

            if (nickname) {
                updateData.nickname = nickname;
            }

            if (selectedLanguages.length > 0) {
                updateData.learning_language_ids = selectedLanguages;
            }

            if (Object.keys(updateData).length === 0) {
                showResult('update-result', 'error', '❌ 수정할 내용을 입력해주세요.');
                return;
            }

            showResult('update-result', 'info', '<div class="loading"></div> 프로필 수정 중...');

            try {
                const response = await fetch(`${API_BASE_URL}/users/me/profile/update`, {
                    method: 'PATCH',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(updateData)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showResult('update-result', 'success', '✅ 프로필이 성공적으로 수정되었습니다!');

                    // 프로필 조회
                    await loadProfile();
                } else {
                    const errorMsg = result.data?.errors
                        ? JSON.stringify(result.data.errors, null, 2)
                        : result.message || JSON.stringify(result, null, 2);
                    showResult('update-result', 'error', `❌ 프로필 수정 실패: ${errorMsg}`);
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                showResult('update-result', 'error', `❌ 네트워크 오류: ${error.message}`);
            }
        }

        // 현재 사용자 정보 조회 (프로필 포함)
        async function loadCurrentUser() {
            showResult('current-user-result', 'info', '<div class="loading"></div> 사용자 정보 조회 중...');

            try {
                const response = await fetch(`${API_BASE_URL}/users/me`, {
                    headers: getAuthHeaders()
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const data = result.data;
                    let profileInfo = '';
                    if (data.has_profile && data.profile) {
                        const languageBadges = data.profile.learning_languages
                            .map(lang => `<span class="badge">${lang.name_ko}</span>`)
                            .join('');

                        profileInfo = `
                            <h4 style="color: #667eea; margin-top: 1rem;">📋 프로필 정보</h4>
                            <div class="profile-item"><strong>닉네임:</strong> ${data.profile.nickname}</div>
                            <div class="profile-item"><strong>출신 국가:</strong> ${data.profile.country.name_ko}</div>
                            <div class="profile-item">
                                <strong>배우고자 하는 언어:</strong><br>
                                ${languageBadges}
                            </div>
                        `;
                    } else {
                        profileInfo = `
                            <div style="background: #fff3cd; padding: 1rem; border-radius: 5px; margin-top: 1rem;">
                                ⚠️ 프로필이 없습니다.
                            </div>
                        `;
                    }

                    // 역할별 배지 색상
                    const roleBadgeColors = {
                        'admin': '#dc3545',
                        'staff': '#fd7e14',
                        'user': '#28a745'
                    };
                    const roleColor = roleBadgeColors[data.role] || '#6c757d';
                    const roleBadge = `<span style="background: ${roleColor}; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem;">${data.role_display || data.role}</span>`;

                    showResult('current-user-result', 'success', `
                        <h3>✅ 사용자 정보</h3>
                        <div class="profile-item"><strong>이메일:</strong> ${data.email}</div>
                        <div class="profile-item"><strong>사용자명:</strong> ${data.username}</div>
                        <div class="profile-item"><strong>역할:</strong> ${roleBadge}</div>
                        <div class="profile-item"><strong>Google ID:</strong> ${data.google_id || '-'}</div>
                        <div class="profile-item"><strong>가입일:</strong> ${new Date(data.date_joined).toLocaleString('ko-KR')}</div>
                        <div class="profile-item"><strong>프로필 여부:</strong> ${data.has_profile ? '✅ 있음' : '❌ 없음'}</div>
                        ${profileInfo}
                    `);
                } else {
                    const errorMsg = result.message || JSON.stringify(result, null, 2);
                    showResult('current-user-result', 'error', `❌ 사용자 정보 조회 실패: ${errorMsg}`);
                }
            } catch (error) {
                console.error('Error loading current user:', error);
                showResult('current-user-result', 'error', `❌ 네트워크 오류: ${error.message}`);
            }
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', async () => {
            const isAuthenticated = await checkAuth();

            if (isAuthenticated) {
                await loadMasterData();
                await loadProfile();
            }
        });
    </script>
</body>
</html>
