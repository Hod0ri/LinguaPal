services:
  db:
    image: postgres:17-alpine
    container_name: linguapal-db-dev
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Elasticsearch (나중에 사용 예정)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: linguapal-es-dev
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: linguapal-dev
    ports:
      - "8000:8000"
    volumes:
      # 소스 코드 볼륨 마운트 (실시간 반영)
      - ../LinguaPal:/app
      # Python 캐시 제외
      - /app/__pycache__
    env_file:
      - ../.env
    depends_on:
      - db
    stdin_open: true
    tty: true
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
  # elasticsearch_data:
