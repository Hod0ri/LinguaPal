services:
  db:
    image: postgres:17-alpine
    container_name: linguapal-db-dev
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: linguapal-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: linguapal-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=linguapal
      - RABBITMQ_DEFAULT_PASS=linguapal_mq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: linguapal-es-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.11.0
  #   container_name: linguapal-kibana-dev
  #   ports:
  #     - "5601:5601"
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   depends_on:
  #     - elasticsearch
  #   restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: linguapal-dev
    ports:
      - "8000:8000"
    volumes:
      - ../LinguaPal:/app
      - /app/__pycache__
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=amqp://linguapal:linguapal_mq@rabbitmq:5672//
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    depends_on:
      - db
      - minio
      - rabbitmq
      - elasticsearch
    stdin_open: true
    tty: true
    command: python manage.py runserver 0.0.0.0:8000

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: linguapal-celery-dev
    volumes:
      - ../LinguaPal:/app
      - /app/__pycache__
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=amqp://linguapal:linguapal_mq@rabbitmq:5672//
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      elasticsearch:
        condition: service_started
    command: celery -A LinguaPal worker -l info -Q xapi,elasticsearch,default
    restart: unless-stopped

  # flower:
  #   image: mher/flower:0.9.7
  #   container_name: linguapal-flower-dev
  #   ports:
  #     - "5555:5555"
  #   environment:
  #     - CELERY_BROKER_URL=amqp://linguapal:linguapal_mq@rabbitmq:5672//
  #   depends_on:
  #     - rabbitmq
  #     - celery_worker
  #   command: celery --broker=amqp://linguapal:linguapal_mq@rabbitmq:5672// flower --port=5555
  #   restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend.dev
    container_name: linguapal-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_APP_NAME=LinguaPal
    depends_on:
      - web
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  elasticsearch_data:
