version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: linguapal-db-prod
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Elasticsearch (나중에 사용 예정)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: linguapal-es-prod
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: linguapal-prod
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - RUN_MOD=PROD
    env_file:
      - ../.env
    depends_on:
      - db
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile - LinguaPal.wsgi:application

volumes:
  postgres_data:
  # elasticsearch_data:
