version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: linguapal-prod
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - RUN_MOD=PROD
    env_file:
      - ../.env
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile - LinguaPal.wsgi:application
